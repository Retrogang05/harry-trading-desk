name: Opy — options scan

on:
  # 21:00 UTC = 4pm ET (EST) / 5pm ET (EDT) - after the close in both DST
  # states. Unlike Monu, Opy's data doesn't need to be fresh at the open:
  # CBOE quotes are ~15 min delayed and this is an end-of-day shortlist, not
  # a breakout scan, so there's no reason to race the pre-market. Weekdays only.
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

# NOT triggered on push - same reasoning as Monu's workflow: a scan makes one
# Claude call per published signal, so it should run on a schedule or by
# hand, never on every commit.

permissions:
  contents: write

concurrency:
  # Separate group from Monu's "momentum-scan" - the two agents' scans must
  # never block each other, only guard against two Opy runs racing each other.
  group: opy-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # The options pipeline fetches a CBOE chain plus Yahoo earnings/sector
    # calls for up to ~80 candidates per strategy side across four strategies
    # (deduplicated per-symbol by cboe.py's cache) - a few minutes in
    # practice, but bound it well above that so a stuck run doesn't burn the
    # whole free-minutes budget.
    timeout-minutes: 15
    steps:
      # Same pinned SHAs as momentum-scan.yml - see that file's comment.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show resolved versions
        run: pip list

      - name: Run scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: opy
        run: python agent.py

      - name: Commit results
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          mkdir -p opy/results
          cp opy/opy_results.json "opy/results/scan_$(date +%Y%m%d).json"

          # Stage only Opy's own file plus the manifest - Monu's scan can run
          # concurrently on its own schedule without either clobbering the
          # other's committed data.
          git add opy/results/ docs/data/OPY.json docs/data/agents.json

          if git diff --staged --quiet; then
            echo "No change in scan output - nothing to commit."
          else
            git commit -m "Opy scan $(date +%Y-%m-%d)"
            git push
          fi
