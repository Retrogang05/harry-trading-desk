name: Results — replay published signals

on:
  # 10:12pm New York, Monday-Friday: after every agent has published (the
  # last, Leaders, runs at 9:57). Same two-cron + gate pattern as the agents:
  # 10:12pm New York is 02:12 UTC under EDT and 03:12 UTC under EST.
  schedule:
    - cron: '12 2 * * 2-6'
    - cron: '12 3 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.tz.outputs.go }}
    steps:
      - id: tz
        env:
          FIRED: ${{ github.event.schedule }}
        run: |
          off=$(TZ=America/New_York date +%z)          # -0400 EDT, -0500 EST
          want=$([ "$off" = "-0400" ] && echo 2 || echo 3)
          got=$(echo "$FIRED" | awk '{print $2}')
          if [ -z "$FIRED" ] || [ "$got" = "$want" ]; then go=true; else go=false; fi
          echo "New York offset $off; fired hour ${got:-manual}; want $want; go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  replay:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # No Claude calls and no bar wait: it only reads the archives the
      # agents already committed, plus prices.
      - name: Replay signals
        run: python track/agent.py

      - name: Commit results
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/data/results.json
          if git diff --staged --quiet; then
            echo "No change - nothing to commit."
          else
            git commit -m "Results $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
