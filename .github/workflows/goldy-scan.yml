name: Goldy — MA cross scan

on:
  # 21:30 UTC = after the close in both DST states. A cross is read off the
  # closing prices, so it can only be confirmed once the session is done -
  # running pre-open like Monu would just re-report yesterday's answer.
  #
  # 21:30, not 21:00 or 21:15: Opy runs at 21:00 and Trey at 21:15. Workflows
  # scheduled at the same minute run in parallel and all push to main, and
  # without staggering the later pushes are rejected as non-fast-forward and
  # that day's data is silently lost. (The pull --rebase below is the real
  # fix; the stagger is belt-and-braces.) Weekdays only.
  schedule:
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

# NOT on push - same rule as the other three agents. A scan makes one Claude
# call per published row, so it runs on a schedule or by hand, never on every
# commit.

permissions:
  contents: write

concurrency:
  group: goldy-scan      # own group: never blocks or races the other agents
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # ~85s in practice for 1,521 symbols; bound a hung fetch well above that.
    timeout-minutes: 20
    steps:
      # Same pinned SHAs as the other three workflows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show resolved versions
        run: pip list

      - name: Run scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: goldy
        run: python agent.py

      - name: Commit results
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Dated archive, same as the other agents: a run of these files is
          # what scripts/review_signals.py scores the strategy against later.
          mkdir -p goldy/results
          cp goldy/goldy_results.json "goldy/results/scan_$(date +%Y%m%d).json"

          # Only this agent's own files plus the manifest - never another
          # agent's data.
          git add goldy/results/ docs/data/GOLD.json docs/data/agents.json

          if git diff --staged --quiet; then
            echo "No change in scan output - nothing to commit."
          else
            git commit -m "Goldy scan $(date +%Y-%m-%d)"
            # Another agent may have pushed since checkout. Each agent stages
            # only its own files, so a rebase never conflicts - but without it
            # a bare push is rejected and the scan's data is silently dropped.
            git pull --rebase origin main
            git push
          fi
