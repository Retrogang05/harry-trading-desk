<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harry Trading Desk</title>
<style>
  /* Minimalist dark. The chrome is entirely neutral — the only hues in the
     interface are semantic (green = strength/target, red = risk/stop) plus a
     single muted dot per agent. Nothing else competes with the data. */
  :root {
    --bg:      #0a0a0b;
    --surface: #101012;
    --raised:  #17171a;
    --sunk:    #08080a;
    --bd:      #1c1c20;
    --bd-hi:   #2a2a31;
    --text:    #e9e9ec;
    --label:   #9b9ba4;
    --dim:     #63636d;
    --faint:   #3d3d45;

    --green:   #46a758;
    --green-b: #5ec26e;
    --red:     #e05561;
    --amber:   #c8974a;
    --slate:   #7b8794;

    --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 13px; line-height: 1.5;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    display: flex; flex-direction: column;
  }
  /* Every number in the app is monospaced and tabular so columns align. */
  .n, td.n, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  /* ── top bar ── */
  .topbar {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 11px 18px; border-bottom: 1px solid var(--bd); background: var(--surface);
  }
  .mark { font-size: 13.5px; font-weight: 600; letter-spacing: -0.01em; }
  .mark span { color: var(--dim); font-weight: 400; }
  .cmd {
    flex: 1 1 240px; min-width: 150px; max-width: 340px;
    border: 1px solid var(--bd); border-radius: 6px; background: var(--sunk);
    color: var(--text); padding: 5px 11px; font-family: var(--sans); font-size: 12.5px;
  }
  .cmd::placeholder { color: var(--faint); }
  .cmd:focus { outline: none; border-color: var(--bd-hi); background: var(--raised); }
  .tb-r { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
          font-size: 12px; color: var(--dim); }
  .live { display: inline-flex; align-items: center; gap: 7px; color: var(--label); }
  .led { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
  .pill { border: 1px solid var(--bd); border-radius: 999px; padding: 2px 10px; color: var(--dim); font-size: 11.5px; }

  /* ── tabs ── */
  .tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--bd);
          background: var(--surface); overflow-x: auto; }
  .tab {
    font: inherit; font-size: 12.5px; cursor: pointer; white-space: nowrap;
    background: none; border: none; border-bottom: 1.5px solid transparent;
    color: var(--dim); padding: 9px 14px;
  }
  .tab:hover { color: var(--label); }
  .tab[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--text); }
  .tab .ct { color: var(--faint); margin-left: 7px; font-family: var(--mono); font-size: 11px; }
  .tab[aria-pressed="true"] .ct { color: var(--dim); }

  /* ── tape ── */
  .tape { border-bottom: 1px solid var(--bd); overflow: hidden; height: 30px; background: var(--bg); }
  .tape-tr { display: flex; gap: 26px; align-items: center; height: 100%; white-space: nowrap;
             padding-left: 18px; animation: slide 60s linear infinite; will-change: transform; }
  @keyframes slide { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  .tape:hover .tape-tr { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) { .tape-tr { animation: none; } }
  .tk { display: inline-flex; gap: 7px; align-items: baseline; font-size: 11.5px;
        font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .tk .s { color: var(--label); }
  .tk .p { color: var(--faint); }
  .tk .v { font-weight: 600; }

  /* ── workspace ── */
  .work { flex: 1 1 auto; display: grid; grid-template-columns: 232px minmax(0,1fr) 348px;
          gap: 1px; background: var(--bd); min-height: 0; }
  .col { background: var(--bg); min-width: 0; overflow-y: auto; }

  /* ── panels ── */
  .panel { border-bottom: 1px solid var(--bd); }
  .col > .panel:last-child { border-bottom: none; }
  .ph {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px 8px;
    font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase;
    color: var(--dim); font-weight: 500;
  }
  .ph .r { margin-left: auto; letter-spacing: 0.04em; color: var(--faint);
           font-family: var(--mono); text-transform: none; }
  .pb { padding: 2px 14px 13px; }

  .kv { display: flex; justify-content: space-between; gap: 12px; padding: 3.5px 0; font-size: 12.5px; }
  .kv .k { color: var(--dim); }
  .kv .v { color: var(--text); font-family: var(--mono); font-variant-numeric: tabular-nums; }
  .kv .v.pos { color: var(--green-b); }
  .kv .v.neg { color: var(--red); }

  /* agent roster */
  .ragent {
    display: grid; grid-template-columns: 7px 1fr auto; gap: 11px; align-items: center;
    padding: 9px 14px; cursor: pointer; background: none; border: none;
    font: inherit; text-align: left; width: 100%; border-radius: 0;
  }
  .ragent:hover { background: var(--raised); }
  .ragent[aria-pressed="true"] { background: var(--raised); box-shadow: inset 2px 0 0 var(--text); }
  .ragent .dot { width: 7px; height: 7px; border-radius: 50%; }
  .ragent .nm { color: var(--text); font-size: 12.5px; }
  .ragent .st { color: var(--faint); font-size: 11px; margin-top: 1px; }
  .ragent .n { color: var(--label); font-family: var(--mono); font-size: 12.5px; }

  /* ── grid ── */
  .gw { overflow-x: auto; }
  table.sig { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.sig th {
    text-align: right; font-weight: 500; color: var(--faint); font-size: 10.5px;
    letter-spacing: 0.07em; text-transform: uppercase; padding: 7px 12px;
    border-bottom: 1px solid var(--bd); background: var(--surface);
    position: sticky; top: 0; white-space: nowrap;
  }
  table.sig th.l, table.sig td.l { text-align: left; }
  table.sig td {
    padding: 8px 12px; text-align: right; white-space: nowrap;
    border-bottom: 1px solid #141417;
    font-family: var(--mono); font-variant-numeric: tabular-nums;
  }
  table.sig tbody tr { cursor: pointer; }
  table.sig tbody tr:hover { background: var(--raised); }
  table.sig tbody tr[aria-selected="true"] { background: var(--raised); }
  table.sig tbody tr[aria-selected="true"] td:first-child { box-shadow: inset 2px 0 0 var(--text); }
  .sym { color: var(--text); font-weight: 600; }
  .agt { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 11.5px; }
  .agt .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .muted { color: var(--faint); }

  /* ── detail ── */
  .dhead { display: flex; align-items: baseline; gap: 11px; padding: 14px 14px 12px; flex-wrap: wrap; }
  .dhead .s { font-size: 22px; font-weight: 600; letter-spacing: -0.02em;
              font-family: var(--mono); }
  .dhead .px { color: var(--dim); font-size: 13px; font-family: var(--mono); }
  .dhead .sc { margin-left: auto; text-align: right; }
  .dhead .sc .num { font-size: 24px; font-weight: 600; font-family: var(--mono);
                    font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .dhead .sc .band { font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; margin-top: 1px; }

  .dim { display: grid; grid-template-columns: 74px 1fr 44px; gap: 11px; align-items: center; padding: 4px 0; }
  .dim .dk { color: var(--dim); font-size: 12px; }
  .dim .tr { height: 4px; background: #1a1a1e; border-radius: 2px; overflow: hidden; }
  .dim .fl { height: 100%; border-radius: 2px; }
  .dim .dv { color: var(--faint); font-size: 11px; text-align: right;
             font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .lv4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .lv4 > div { background: var(--surface); border: 1px solid var(--bd); border-radius: 6px; padding: 8px 10px; }
  .lv4 .lk { color: var(--faint); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; }
  .lv4 .lv { font-size: 14px; font-weight: 600; margin-top: 2px;
             font-family: var(--mono); font-variant-numeric: tabular-nums; }

  .read { color: var(--label); font-size: 12.5px; line-height: 1.65; }
  .read.na { color: var(--faint); font-style: italic; }

  .empty { padding: 30px 16px; text-align: center; color: var(--faint); font-size: 12.5px; }

  /* ── status ── */
  .status {
    display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
    padding: 8px 18px; background: var(--surface); border-top: 1px solid var(--bd);
    font-size: 11.5px; color: var(--faint);
  }
  .status b { font-weight: 400; color: var(--faint); }
  .status .val { color: var(--label); font-family: var(--mono); }
  .status .ok { color: var(--green); }
  .status .right { margin-left: auto; color: var(--dim); }

  .foot { padding: 12px 18px 18px; color: var(--faint); font-size: 11.5px; line-height: 1.6; }

  .boot { padding: 56px 24px; text-align: center; }
  .boot h2 { color: var(--text); font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .boot p { color: var(--dim); font-size: 12.5px; margin: 6px 0; }
  .boot code { font-family: var(--mono); color: var(--label); background: var(--raised);
               padding: 2px 6px; border-radius: 4px; font-size: 11.5px; }

  @media (max-width: 1000px) {
    .work { grid-template-columns: 1fr; }
    table.sig th { position: static; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="mark">Harry Trading Desk <span>· research</span></div>
  <input class="cmd" id="cmd" placeholder="Filter symbol…" aria-label="Filter signals by symbol" autocomplete="off">
  <div class="tb-r">
    <span class="live"><span class="led"></span>Live</span>
    <span id="clock" class="mono">—</span>
    <span class="pill">Manual execution</span>
  </div>
</div>

<nav class="tabs" id="tabs"></nav>
<div class="tape" id="tape" hidden><div class="tape-tr" id="tapeTrack"></div></div>

<div class="work" id="work" hidden>
  <div class="col" id="colLeft"></div>
  <div class="col">
    <div class="panel">
      <div class="ph">Signals<span class="r" id="gridCount"></span></div>
      <div class="gw"><table class="sig" id="grid"></table></div>
    </div>
  </div>
  <div class="col" id="colRight"></div>
</div>

<div id="boot" class="boot"><h2>Loading…</h2></div>

<div class="status">
  <span><b>Agents</b> <span class="val" id="stAgents">—</span></span>
  <span><b>Signals</b> <span class="val" id="stSignals">—</span></span>
  <span><b>Feed</b> <span id="stFeed">—</span></span>
  <span><b>Last scan</b> <span class="val" id="stScan">—</span></span>
  <span class="right" id="stReady">Standby</span>
</div>

<div class="foot">
  Research signals, not investment advice. Every position is entered manually by you.
  Scores measure how well a setup matches a strategy's criteria — they are not forecasts.
</div>

<script>
(function () {
  "use strict";

  var DATA = "data/";
  var $ = function (id) { return document.getElementById(id); };
  var state = { feeds: [], rows: [], active: "all", selected: null, query: "" };

  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }

  // Shared bands so every agent's score reads on the same scale.
  function band(s) {
    if (s >= 80) return { t: "Strong", c: "var(--green-b)" };
    if (s >= 70) return { t: "Buy",    c: "var(--amber)" };
    if (s >= 60) return { t: "Watch",  c: "var(--slate)" };
    return { t: "Weak", c: "var(--faint)" };
  }
  function usd(n) { return typeof n === "number" ? n.toFixed(2) : "—"; }
  // Selection key includes strategy: an agent that runs several strategies
  // (Opy screens the same S&P 500 for iron condors, spreads, LEAPS and RSI)
  // can publish more than one row for the same symbol. Keying on symbol+agent
  // alone would make those rows indistinguishable and only one selectable.
  function rowKey(o, agentId) { return o.symbol + "|" + agentId + "|" + (o.strategy || ""); }
  function ago(iso) {
    var t = new Date(iso); if (isNaN(t)) return "unknown";
    var m = Math.round((Date.now() - t) / 6e4);
    if (m < 1) return "just now"; if (m < 60) return m + "m";
    var h = Math.round(m / 60); return h < 24 ? h + "h" : Math.round(h / 24) + "d";
  }
  function getJSON(p) {
    return fetch(DATA + p, { cache: "no-store" }).then(function (r) {
      if (!r.ok) throw new Error(p + " → HTTP " + r.status); return r.json();
    });
  }

  function tick() {
    var d = new Date(), pad = function (n) { return String(n).padStart(2, "0"); };
    $("clock").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }

  function buildRows(feeds) {
    var rows = [];
    feeds.forEach(function (f) {
      (f.opportunities || []).forEach(function (o) { rows.push({ o: o, feed: f, agent: f.agent || {} }); });
    });
    rows.sort(function (a, b) { return b.o.score - a.o.score; });
    return rows;
  }

  function visibleRows() {
    return state.rows.filter(function (r) {
      if (state.active !== "all" && r.agent.id !== state.active) return false;
      if (state.query && r.o.symbol.toUpperCase().indexOf(state.query) === -1) return false;
      return true;
    });
  }

  function renderTape() {
    var track = $("tapeTrack"); track.textContent = "";
    if (!state.rows.length) { $("tape").hidden = true; return; }
    for (var pass = 0; pass < 2; pass++) {          // duplicated for a seamless -50% loop
      state.rows.forEach(function (r) {
        var b = band(r.o.score), s = el("span", "tk");
        s.appendChild(el("span", "s", r.o.symbol));
        s.appendChild(el("span", "p", usd(r.o.price)));
        var v = el("span", "v", String(r.o.score)); v.style.color = b.c;
        s.appendChild(v); track.appendChild(s);
      });
    }
    $("tape").hidden = false;
  }

  function renderTabs() {
    var nav = $("tabs"); nav.textContent = "";
    function tab(id, label, count) {
      var b = el("button", "tab"); b.type = "button";
      b.setAttribute("aria-pressed", String(state.active === id));
      b.appendChild(document.createTextNode(label));
      if (count != null) b.appendChild(el("span", "ct", String(count)));
      b.addEventListener("click", function () { state.active = id; state.selected = null; renderAll(); });
      return b;
    }
    nav.appendChild(tab("all", "All", state.rows.length));
    state.feeds.forEach(function (f) {
      nav.appendChild(tab(f.agent.id, f.agent.name || f.agent.id, (f.opportunities || []).length));
    });
  }

  function renderLeft() {
    var col = $("colLeft"); col.textContent = "";

    var pa = el("div", "panel");
    pa.appendChild(el("div", "ph", "Agents"));
    state.feeds.forEach(function (f) {
      var a = f.agent || {}, n = (f.opportunities || []).length;
      var b = el("button", "ragent"); b.type = "button";
      b.setAttribute("aria-pressed", String(state.active === a.id));
      var dot = el("div", "dot"); dot.style.background = a.accent || "var(--slate)";
      b.appendChild(dot);
      var mid = el("div");
      mid.appendChild(el("div", "nm", a.name || a.id));
      mid.appendChild(el("div", "st", (a.strategy || "") + " · " + (a.id || "")));
      b.appendChild(mid);
      b.appendChild(el("div", "n", String(n)));
      b.addEventListener("click", function () {
        state.active = (state.active === a.id) ? "all" : a.id;
        state.selected = null; renderAll();
      });
      pa.appendChild(b);
    });
    col.appendChild(pa);

    // Session stats follow the current filter, not the whole desk.
    var rows = visibleRows();
    var strong = rows.filter(function (r) { return r.o.score >= 80; }).length;
    var buy = rows.filter(function (r) { return r.o.score >= 70 && r.o.score < 80; }).length;
    var watch = rows.filter(function (r) { return r.o.score < 70; }).length;
    var avg = rows.length ? Math.round(rows.reduce(function (s, r) { return s + r.o.score; }, 0) / rows.length) : 0;

    var ps = el("div", "panel");
    ps.appendChild(el("div", "ph", "Session"));
    var body = el("div", "pb");
    [["Signals", String(rows.length), ""], ["Strong 80+", String(strong), "pos"],
     ["Buy 70–79", String(buy), ""], ["Watch < 70", String(watch), ""],
     ["Average", String(avg), ""]].forEach(function (r) {
      var k = el("div", "kv");
      k.appendChild(el("div", "k", r[0]));
      k.appendChild(el("div", "v " + r[2], r[1]));
      body.appendChild(k);
    });
    ps.appendChild(body); col.appendChild(ps);

    var ctxFeeds = state.active === "all" ? state.feeds
                 : state.feeds.filter(function (f) { return f.agent.id === state.active; });
    ctxFeeds.forEach(function (f) {
      if (!f.context || !f.context.length) return;
      var p = el("div", "panel");
      p.appendChild(el("div", "ph", (f.agent.name || "Agent") + " context"));
      var b = el("div", "pb");
      f.context.forEach(function (c) {
        var k = el("div", "kv");
        k.appendChild(el("div", "k", c.label));
        k.appendChild(el("div", "v", c.value));
        b.appendChild(k);
      });
      p.appendChild(b); col.appendChild(p);
    });
  }

  function renderGrid() {
    var rows = visibleRows(), t = $("grid");
    t.textContent = "";
    $("gridCount").textContent = rows.length + (rows.length === 1 ? " row" : " rows");

    var thead = el("thead"), hr = el("tr");
    [["#","l"],["Symbol","l"],["Agent","l"],["Strategy","l"],["Last",""],["Score",""],["Signal",""],
     ["Entry",""],["Stop",""],["Target",""],["R:R",""],["Setup",""]].forEach(function (h) {
      hr.appendChild(el("th", h[1], h[0]));
    });
    thead.appendChild(hr); t.appendChild(thead);

    var tb = el("tbody");
    if (!rows.length) {
      var tr0 = el("tr"), td0 = el("td", "l"); td0.colSpan = 12;
      td0.appendChild(el("div", "empty", state.query
        ? "No signal matches “" + state.query + "”."
        : "No setups cleared the filter. That is a normal scan result."));
      tr0.appendChild(td0); tb.appendChild(tr0);
    }

    rows.forEach(function (r, i) {
      var o = r.o, b = band(o.score), tr = el("tr");
      var key = rowKey(o, r.agent.id);
      tr.setAttribute("aria-selected", String(state.selected === key));
      tr.addEventListener("click", function () {
        state.selected = key; renderGrid(); renderRight();
      });

      tr.appendChild(el("td", "l muted", String(i + 1)));
      var tdS = el("td", "l"); tdS.appendChild(el("span", "sym", o.symbol)); tr.appendChild(tdS);

      var tdA = el("td", "l"), wrap = el("span", "agt");
      var dot = el("span", "dot"); dot.style.background = r.agent.accent || "var(--slate)";
      wrap.appendChild(dot); wrap.appendChild(document.createTextNode(r.agent.id || "—"));
      tdA.appendChild(wrap); tr.appendChild(tdA);

      // Per-opportunity strategy label if the agent runs more than one
      // (Opy); otherwise the agent's single declared strategy (Monu).
      tr.appendChild(el("td", "l muted", o.strategy || r.agent.strategy || "—"));

      tr.appendChild(el("td", null, usd(o.price)));
      var tdSc = el("td", null, String(o.score)); tdSc.style.color = b.c; tdSc.style.fontWeight = "600";
      tr.appendChild(tdSc);
      var tdV = el("td", null, b.t); tdV.style.color = b.c; tr.appendChild(tdV);

      // Monu's fixed entry/stop/target columns don't generalise to Opy's
      // per-strategy setup shapes (a credit spread's numbers are credit/max
      // loss, not entry/stop). Show them only when present; otherwise the
      // detail panel's declarative Setup block (below) is where that row's
      // numbers live.
      if (typeof o.entry === "number") {
        tr.appendChild(el("td", null, usd(o.entry)));
        var st = el("td", null, usd(o.stop_loss)); st.style.color = "var(--red)"; tr.appendChild(st);
        var tp = el("td", null, usd(o.take_profit)); tp.style.color = "var(--green-b)"; tr.appendChild(tp);
        tr.appendChild(el("td", null, typeof o.risk_reward_ratio === "number" ? o.risk_reward_ratio.toFixed(2) : "—"));
        tr.appendChild(el("td", "muted", o.setup_type ? o.setup_type.toLowerCase() : "—"));
      } else {
        for (var c = 0; c < 4; c++) tr.appendChild(el("td", "muted", "—"));
        tr.appendChild(el("td", "muted", o.setup ? "see detail" : "—"));
      }

      tb.appendChild(tr);
    });
    t.appendChild(tb);
  }

  function renderRight() {
    var col = $("colRight"); col.textContent = "";
    var rows = visibleRows();
    var pick = rows.filter(function (r) { return state.selected === rowKey(r.o, r.agent.id); })[0] || rows[0];

    if (!pick) {
      var p0 = el("div", "panel");
      p0.appendChild(el("div", "ph", "Detail"));
      p0.appendChild(el("div", "empty", "No signal selected."));
      col.appendChild(p0); return;
    }

    var o = pick.o, agent = pick.agent, b = band(o.score);

    var p = el("div", "panel");
    p.appendChild(el("div", "ph", "Detail"));
    var h = el("div", "dhead");
    h.appendChild(el("div", "s", o.symbol));
    h.appendChild(el("div", "px", "$" + usd(o.price)));
    var sc = el("div", "sc");
    var num = el("div", "num", o.score + " / 100"); num.style.color = b.c;
    sc.appendChild(num);
    var bd = el("div", "band", b.t); bd.style.color = b.c; sc.appendChild(bd);
    h.appendChild(sc); p.appendChild(h);

    var meta = el("div", "pb");
    var mk = el("div", "kv");
    mk.appendChild(el("div", "k", "Agent"));
    var vwrap = el("div", "v");
    var d2 = el("span", "dot");
    d2.style.cssText = "display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;background:" + (agent.accent || "#7b8794");
    vwrap.appendChild(d2);
    vwrap.appendChild(document.createTextNode(agent.name || "—"));
    mk.appendChild(vwrap); meta.appendChild(mk);
    var strategyLabel = o.strategy || agent.strategy;
    if (strategyLabel) {
      var sk = el("div", "kv");
      sk.appendChild(el("div", "k", "Strategy"));
      sk.appendChild(el("div", "v", strategyLabel));
      meta.appendChild(sk);
    }
    p.appendChild(meta); col.appendChild(p);

    // Score breakdown — an opportunity's own dimensions win when present
    // (Opy: each strategy scores on different axes, so a single per-agent
    // declaration can't describe all of them), else the agent-level
    // dimensions every row shares (Monu).
    var dims = o.dimensions || pick.feed.dimensions || [];
    if (dims.length && o.breakdown) {
      var pd = el("div", "panel");
      pd.appendChild(el("div", "ph", "Score breakdown"));
      var body = el("div", "pb");
      dims.forEach(function (d) {
        var got = o.breakdown[d.key];
        if (typeof got !== "number") return;
        var pct = d.max ? Math.max(0, Math.min(100, got / d.max * 100)) : 0;
        var row = el("div", "dim");
        row.appendChild(el("div", "dk", d.label));
        var tr = el("div", "tr"), fl = el("div", "fl");
        fl.style.width = pct + "%";
        fl.style.background = pct >= 80 ? "var(--green)" : pct >= 45 ? "var(--slate)" : "var(--faint)";
        tr.appendChild(fl); row.appendChild(tr);
        row.appendChild(el("div", "dv", got + "/" + d.max));
        body.appendChild(row);
      });
      pd.appendChild(body); col.appendChild(pd);
    }

    if (typeof o.entry === "number") {
      var pl = el("div", "panel");
      var lh = el("div", "ph", "Setup");
      var bits = [];
      if (o.setup_type) bits.push(o.setup_type.toLowerCase());
      if (typeof o.extension_pct === "number") {
        bits.push((o.extension_pct >= 0 ? "+" : "") + o.extension_pct.toFixed(1) + "% vs MA20");
      }
      if (bits.length) lh.appendChild(el("span", "r", bits.join("  ·  ")));
      pl.appendChild(lh);
      var lb = el("div", "pb"), g = el("div", "lv4");
      [["Entry", usd(o.entry), "var(--text)"],
       ["Stop", usd(o.stop_loss), "var(--red)"],
       ["Target", usd(o.take_profit), "var(--green-b)"],
       ["R:R", (typeof o.risk_reward_ratio === "number" ? o.risk_reward_ratio.toFixed(2) : "—"), "var(--text)"]
      ].forEach(function (c) {
        var box = el("div");
        box.appendChild(el("div", "lk", c[0]));
        var v = el("div", "lv", c[1]); v.style.color = c[2];
        box.appendChild(v); g.appendChild(box);
      });
      lb.appendChild(g);
      var risk = el("div", "kv"); risk.style.marginTop = "11px";
      risk.appendChild(el("div", "k", "Risk per share"));
      risk.appendChild(el("div", "v neg", "$" + usd(Math.abs(o.entry - o.stop_loss))));
      lb.appendChild(risk);
      pl.appendChild(lb); col.appendChild(pl);
    } else if (o.setup) {
      // Declarative setup block: for strategies whose trade numbers aren't
      // entry/stop/target (a credit spread's are credit/max-loss/ROC/POP, a
      // LEAPS call's are premium/breakeven/leverage/%ITM), the agent
      // supplies its own field list rather than the page assuming a shape
      // that doesn't fit. Monu never sets this - the branch above always
      // wins for its rows, so this is purely additive.
      var pl2 = el("div", "panel");
      var lh2 = el("div", "ph", "Setup");
      if (o.setup.label) lh2.appendChild(el("span", "r", o.setup.label));
      pl2.appendChild(lh2);
      var lb2 = el("div", "pb"), g2 = el("div", "lv4");
      (o.setup.fields || []).forEach(function (f) {
        var box = el("div");
        box.appendChild(el("div", "lk", f.label));
        var v = el("div", "lv", f.value);
        if (f.tone === "pos") v.style.color = "var(--green-b)";
        else if (f.tone === "neg") v.style.color = "var(--red)";
        box.appendChild(v); g2.appendChild(box);
      });
      lb2.appendChild(g2);
      pl2.appendChild(lb2); col.appendChild(pl2);
    }
    // Neither branch: a signal without a specific structure (Opy's RSI rows) -
    // the reasoning panel below is where that row's explanation lives instead.

    // Bracketed reasoning is the agent's failure sentinel — shown plainly
    // rather than attributed to the agent as if it had spoken.
    if (o.reasoning) {
      var na = /^\[.*\]$/.test(o.reasoning.trim());
      var pr = el("div", "panel");
      pr.appendChild(el("div", "ph", na ? "Reasoning" : (agent.name || "Agent") + "'s read"));
      var rb = el("div", "pb");
      rb.appendChild(el("div", "read" + (na ? " na" : ""), o.reasoning));
      pr.appendChild(rb); col.appendChild(pr);
    }
  }

  function renderStatus() {
    $("stAgents").textContent = String(state.feeds.length);
    $("stSignals").textContent = String(state.rows.length);
    var newest = state.feeds.map(function (f) { return f.scan_date; }).filter(Boolean).sort().pop();
    $("stScan").textContent = newest ? ago(newest) + " ago" : "—";
    $("stFeed").textContent = ""; $("stFeed").appendChild(el("span", "ok", "connected"));
    $("stReady").textContent = "Ready";
  }

  function renderAll() { renderTabs(); renderLeft(); renderGrid(); renderRight(); renderStatus(); }

  $("cmd").addEventListener("input", function (e) {
    state.query = e.target.value.trim().toUpperCase();
    state.selected = null;
    renderLeft(); renderGrid(); renderRight();
  });

  function fail(err) {
    $("work").hidden = true; $("tape").hidden = true;
    var b = $("boot"); b.hidden = false; b.textContent = "";
    b.appendChild(el("h2", null, "No agent data"));
    var p1 = el("p"); p1.appendChild(document.createTextNode("Could not read "));
    p1.appendChild(el("code", null, "data/agents.json")); b.appendChild(p1);
    var p2 = el("p"); p2.appendChild(document.createTextNode("Run "));
    p2.appendChild(el("code", null, "python agent.py"));
    p2.appendChild(document.createTextNode(", then serve over HTTP: "));
    p2.appendChild(el("code", null, "python -m http.server --directory docs"));
    b.appendChild(p2);
    b.appendChild(el("p", null, "Opening the file directly with file:// will not work — the browser blocks the fetch."));
    b.appendChild(el("p", null, String(err && err.message || err)));
    $("stFeed").textContent = "offline";
    $("stReady").textContent = "Halted";
  }

  tick(); setInterval(tick, 1000);

  getJSON("agents.json")
    .then(function (m) {
      var ids = (m && m.agents) || [];
      if (!ids.length) throw new Error("manifest lists no agents");
      return Promise.all(ids.map(function (id) {
        return getJSON(id + ".json").catch(function (e) {
          console.error("skipping agent " + id + ":", e); return null;
        });
      }));
    })
    .then(function (res) {
      state.feeds = res.filter(Boolean);
      if (!state.feeds.length) throw new Error("every agent feed failed to load");
      state.rows = buildRows(state.feeds);
      $("boot").hidden = true; $("work").hidden = false;
      renderTape(); renderAll();
    })
    .catch(fail);
})();
</script>
</body>
</html>
