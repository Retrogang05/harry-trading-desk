name: Pocket — volume screen + level map

on:
  # 21:45 UTC = after the close in both DST states. Relative volume needs the
  # session's FULL volume, so this cannot run before the close the way Monu
  # does. Yahoo's daily bar can still land late; the published "Data as of"
  # says which session was actually screened.
  #
  # 21:45, staggered behind Opy 21:00, Trey 21:15 and Goldy 21:30: workflows
  # at the same minute run in parallel and all push to main. The pull
  # --rebase below is the real fix; the stagger is belt-and-braces.
  # Weekdays only.
  schedule:
    - cron: '45 21 * * 1-5'
  workflow_dispatch:

# NOT on push - same rule as the other three agents. A scan makes one Claude
# call per published row, so it runs on a schedule or by hand, never on every
# commit.

permissions:
  contents: write

concurrency:
  group: pocket-scan      # own group: never blocks or races the other agents
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # ~80s in practice for 1,521 symbols; bound a hung fetch well above that.
    timeout-minutes: 20
    steps:
      # Same pinned SHAs as the other three workflows.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show resolved versions
        run: pip list

      - name: Run scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: pocket
        run: python agent.py

      - name: Commit results
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Dated archive, same as the other agents: a run of these files is
          # what scripts/review_signals.py scores the strategy against later.
          mkdir -p pocket/results
          cp pocket/pocket_results.json "pocket/results/scan_$(date +%Y%m%d).json"

          # Only this agent's own files plus the manifest - never another
          # agent's data.
          git add pocket/results/ docs/data/PCKT.json docs/data/agents.json

          if git diff --staged --quiet; then
            echo "No change in scan output - nothing to commit."
          else
            git commit -m "Pocket scan $(date +%Y-%m-%d)"
            # Another agent may have pushed since checkout. Each agent stages
            # only its own files, so a rebase never conflicts - but without it
            # a bare push is rejected and the scan's data is silently dropped.
            git pull --rebase origin main
            git push
          fi
