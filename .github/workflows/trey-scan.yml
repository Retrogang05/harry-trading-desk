name: Trey — TQQQ signal

on:
  # 21:00 UTC = 4pm ET (EST) / 5pm ET (EDT): after the close in both DST
  # states. The state is read off the closing prices and meant to be acted
  # on the next session, so an after-close run publishes tomorrow's
  # position. Weekdays only.
  schedule:
    # 21:15, not 21:00: Opy is scheduled at 21:00. Two workflows at the same
    # minute run in parallel and both push to main; without staggering, the
    # second push is rejected as non-fast-forward and that day's data is lost.
    # (The pull --rebase below is the real fix; the stagger is belt-and-braces.)
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

# NOT on push - same rule as the other two agents. Cheaper than either of
# them (one Claude call per run, two tickers) but the principle holds.

permissions:
  contents: write

concurrency:
  group: trey-scan       # own group: never blocks or races Monu or Opy
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # two tickers and one API call; well under a minute in practice
    steps:
      # Same pinned SHAs as momentum-scan.yml and opy-scan.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show resolved versions
        run: pip list

      - name: Run signal
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        working-directory: trey
        run: python agent.py

      - name: Commit results
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Dated archive: this is the one agent where the history IS the
          # product - a run of these files is the record of every state
          # change, which is what you'd audit the strategy against later.
          mkdir -p trey/results
          cp trey/trey_results.json "trey/results/signal_$(date +%Y%m%d).json"

          # Only this agent's own file plus the manifest - never the other
          # agents' data.
          git add trey/results/ docs/data/TREY.json docs/data/agents.json

          if git diff --staged --quiet; then
            echo "No change in signal output - nothing to commit."
          else
            git commit -m "Trey signal $(date +%Y-%m-%d)"
            # Another agent may have pushed since checkout. Each agent stages
            # only its own files, so a rebase never conflicts - but without it
            # a bare push is rejected and the scan's data is silently dropped.
            git pull --rebase origin main
            git push
          fi
